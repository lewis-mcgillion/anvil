[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-schema"
version = "1.0.0"
description = "Typed Anvil capture SDK and frozen v1 JSON Schema validators"
readme = { text = "Capture-only Python SDK. See docs/sdk.md and schemas/README.md in the Anvil repository.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema==4.25.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[tool.setuptools]
packages = ["anvil", "anvil_schema"]
py-modules = ["_build"]

[tool.setuptools.cmdclass]
build_py = "_build.BuildPy"
sdist = "_build.SDist"

[tool.setuptools.package-data]
anvil = ["py.typed"]
anvil_schema = ["py.typed", "schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
