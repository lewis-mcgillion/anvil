[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-schema"
version = "1.0.0"
description = "Validators for Anvil's frozen v1 event and recording JSON Schemas"
readme = { text = "See schemas/README.md at the repository root.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema==4.25.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[tool.setuptools]
packages = ["anvil_schema", "anvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
