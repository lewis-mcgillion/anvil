name: Bug report
description: Report a reproducible problem in Anvil
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use SECURITY.md instead of this form."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproduction, including version or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and context
      description: Include relevant logs, with secrets and personal data removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
