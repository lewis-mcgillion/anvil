name: Feature request
description: Propose an improvement to Anvil
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful solution and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Contract and safety impact
      description: Explain API/schema, compatibility, security, and replay implications.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
