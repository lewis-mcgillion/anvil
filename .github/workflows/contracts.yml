name: contracts

on:
  pull_request:
    paths:
      - 'api/**'
      - 'proto/**'
      - 'runner/**'
      - 'server/**'
      - 'web/**'
      - 'docs/**'
      - 'Makefile'
      - 'buf.*.yaml'
      - '.github/workflows/contracts.yml'

permissions: {}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validators
        run: python -m pip install -e './sdk/python[test]'

      - name: Validate Python and TypeScript contracts
        run: |
          python -m pytest -q sdk/python/tests
          (cd web && npm ci && npm run generate)
          (cd web && npx tsc --noEmit)
