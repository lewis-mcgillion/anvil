name: Docs checks

on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  adr-and-threat-model:
    name: ADR and threat model contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check documentation contracts
        shell: bash
        run: python3 scripts/check_docs.py
      - name: Self-test the documentation checker
        shell: bash
        run: python3 scripts/check_docs.py --self-test
