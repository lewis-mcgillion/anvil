name: Polyglot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/requirements.lock
      - run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests
      - run: python -m compileall -q sdk/python/anvil

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - run: npm --prefix web run lint
      - run: npm --prefix web run format
      - run: npm --prefix web test

  containers:
    runs-on: ubuntu-latest
    needs: [go, python, typescript]
    steps:
      - uses: actions/checkout@v4.2.2
      - run: docker build --file deploy/containers/api.Dockerfile .
      - run: docker build --file deploy/containers/sdk.Dockerfile sdk/python
