name: Polyglot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/requirements.lock
      - run: python -m pip install -e './sdk/python[test]'
      - run: PYTHONPATH=sdk/python python -m pytest -q sdk/python/tests tests/test_migration_contract.py
      - run: python -m compileall -q sdk/python/anvil

  python-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e './sdk/python' -e './server[test]'
      - run: python -m pytest -q server/tests

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: anvil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: anvil_test
    steps:
      - uses: actions/checkout@v4.2.2
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0001_core.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0002_authorization.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0002_jobs.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0002_administration.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0003_run_metadata.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0004_seal_jobs.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0005_agent_versions.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migrations/0006_archive_jobs.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/tenant-isolation.sql
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "INSERT INTO run_streams(id,run_id,project_id,name) VALUES ('0199b167-0000-7000-8000-000000000031','0199b167-0000-7000-8000-000000000021','0199b167-0000-7000-8000-000000000011','main')"
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e './sdk/python' -e './server[test]'
      - run: python -m pytest -q server/tests/test_postgres_integration.py
        env:
          ANVIL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:anvil_test@localhost:5432/postgres

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run build

  containers:
    runs-on: ubuntu-latest
    needs: [python, python-server, typescript, postgres]
    steps:
      - uses: actions/checkout@v4.2.2
      - run: docker build --file deploy/containers/api.Dockerfile .
      - run: docker build --file deploy/containers/sdk.Dockerfile sdk/python
