server {
    listen 8080;
    server_name _;

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
